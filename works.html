  <style>
    :root {
      --bg: #050507;
      --text: #f8fafc;
      --muted: #a1a1aa;
      --accent: #e11d48;
      --line: rgba(255, 255, 255, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
    html { overflow-x: clip; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', 'Cairo', sans-serif;
      overflow-x: clip;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    html[lang="ar"] body {
      font-family: 'Cairo', 'Plus Jakarta Sans', sans-serif;
    }

    /* خلفية الفيديو الصامت */
    .ambient-video-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      overflow: hidden;
      background: #050507;
    }

    .ambient-video-bg video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.36;
      filter: brightness(1.12) contrast(1.06);
    }

    .ambient-overlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(5, 5, 7, 0.52) 0%,
        rgba(5, 5, 7, 0.64) 55%,
        rgba(5, 5, 7, 0.84) 100%
      );
    }

    .num { font-family: 'Plus Jakarta Sans', sans-serif; }
    .container { max-width: 1220px; margin: 0 auto; padding: 0 24px; width: 100%; }

    .clip-brand-font {
      font-family: 'Anton', 'Archivo Black', sans-serif;
      font-style: italic;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      line-height: 0.96;
      display: inline-block;
      transform: skewX(-7deg) scaleY(1.06);
    }

    /* Header */
    header.site-header {
      position: sticky;
      top: 0;
      z-index: 300;
      width: 100%;
      background: rgba(5, 5, 7, 0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
      padding: 15px 0;
    }

    .nav-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      width: 100%;
    }

    .brand {
      direction: rtl;
      unicode-bidi: isolate;
      text-decoration: none;
      color: #fff;
      font-size: clamp(1.2rem, 2.2vw, 1.5rem);
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .brand-tag {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--accent);
      border: 1px solid rgba(225, 29, 72, 0.45);
      background: rgba(225, 29, 72, 0.14);
      padding: 3px 9px;
      border-radius: 6px;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 26px;
    }

    nav a {
      text-decoration: none;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.94rem;
      white-space: nowrap;
      transition: color 0.2s ease;
    }

    nav a:hover,
    nav a.active {
      color: #fff;
    }

    nav a.active {
      color: var(--accent);
    }
