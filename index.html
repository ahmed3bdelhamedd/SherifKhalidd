<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SHERIF KHALID — Official Hub</title>
  <link rel="icon" href="assts/sherif_khalid7.jpg" type="image/jpeg" />
  <link rel="apple-touch-icon" href="assts/sherif_khalid7.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Cairo:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050507;
      --text: #f8fafc;
      --muted: #a1a1aa;
      --accent: #e11d48;
      --line: rgba(255, 255, 255, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
    html { overflow-x: clip; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Cairo', sans-serif;
      overflow-x: clip;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* إنترو افتتاحي للموقع */
    #siteIntro {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #050507;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      cursor: pointer;
      transition: opacity 0.65s ease, visibility 0.65s ease;
    }

    #siteIntro.done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-brand {
      font-size: clamp(2.6rem, 8vw, 5.2rem);
      color: #fff;
      animation: introPulse 1.1s ease-out;
    }

    .intro-sub {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
    }

    @keyframes introPulse {
      0% { opacity: 0; transform: skewX(-7deg) scale(0.92); }
      100% { opacity: 1; transform: skewX(-7deg) scale(1.06); }
    }

    /* فيديو الخلفية الصامت بإضاءة أوضح */
    .ambient-video-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      overflow: hidden;
      background: #050507;
    }

    .ambient-video-bg video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.36;
      filter: brightness(1.12) contrast(1.06);
    }

    .ambient-overlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(5, 5, 7, 0.52) 0%,
        rgba(5, 5, 7, 0.64) 55%,
        rgba(5, 5, 7, 0.84) 100%
      );
    }

    .num { font-family: 'Plus Jakarta Sans', sans-serif; }
    .container { max-width: 1180px; margin: 0 auto; padding: 0 24px; width: 100%; }

    .clip-brand-font {
      font-family: 'Anton', 'Archivo Black', sans-serif;
      font-style: italic;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      line-height: 0.96;
      display: inline-block;
      transform: skewX(-7deg) scaleY(1.06);
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 300;
      background: rgba(5, 5, 7, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
      padding: 16px 0;
    }

    .nav-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      gap: 20px;
    }

    .brand {
      text-decoration: none;
      color: #fff;
      font-size: clamp(1.15rem, 2.2vw, 1.45rem);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      transform: skewX(7deg);
    }

    nav { display: flex; gap: 28px; align-items: center; }

    nav a {
      text-decoration: none;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }

    nav a:hover,
    nav a.active {
      color: #fff;
    }

    nav a.active {
      color: var(--accent);
    }

    .menu-btn {
      display: none;
      background: transparent;
      border: 1px solid var(--line);
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      font-family: 'Cairo', sans-serif;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Main Seamless Flow */
    .main-flow {
      padding: 60px 0 90px;
    }

    .top-intro {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 44px;
      align-items: center;
      margin-bottom: 64px;
    }

    h1 .hero-title {
      display: block;
      font-size: clamp(3.2rem, 7.5vw, 6.2rem);
      color: #fff;
      transform-origin: right center;
      margin-bottom: 20px;
      text-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
    }

    .intro-text {
      color: #e4e4e7;
      font-size: clamp(1.02rem, 1.4vw, 1.12rem);
      line-height: 1.9;
      max-width: 540px;
      margin-bottom: 34px;
    }

    .stats-inline {
      display: flex;
      flex-wrap: wrap;
      gap: 36px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    .stat-item strong {
      display: block;
      font-size: clamp(1.7rem, 3vw, 2.3rem);
      font-weight: 800;
      color: #fff;
      line-height: 1.05;
    }

    .stat-item span {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 700;
      margin-top: 6px;
    }

    .lead-portrait {
      width: 100%;
      max-width: 430px;
      margin-inline: auto;
      aspect-ratio: 4 / 5;
      max-height: 520px;
      object-fit: cover;
      object-position: center top;
      border-radius: 22px;
      display: block;
      box-shadow: 0 28px 65px rgba(0, 0, 0, 0.75);
    }

    .flow-title {
      font-size: clamp(1.45rem, 2.8vw, 2rem);
      font-weight: 900;
      color: #fff;
      margin-bottom: 22px;
      margin-top: 24px;
    }

    /* عرض الأغنية */
    .track-player {
      max-width: 860px;
      aspect-ratio: 16 / 9;
      border-radius: 20px;
      overflow: hidden;
      background: #09090d;
      margin-bottom: 56px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
    }

    .track-player iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* تصغير الصور وشبكة أوسع */
    .photo-stream {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      align-items: start;
    }

    .photo-stream img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      object-position: center top;
      border-radius: 16px;
      display: block;
      cursor: pointer;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .photo-stream img:hover {
      transform: scale(1.025);
      opacity: 0.95;
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(5, 5, 7, 0.94);
      backdrop-filter: blur(16px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox.open { display: flex; }

    .lightbox-panel {
      position: relative;
      max-width: 760px;
      width: 100%;
    }

    .lightbox-panel img {
      width: 100%;
      max-height: 84dvh;
      object-fit: contain;
      border-radius: 18px;
      display: block;
    }

    .lightbox-close {
      position: absolute;
      top: 14px;
      left: 14px;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(5, 5, 7, 0.88);
      color: #fff;
      font-family: 'Cairo', sans-serif;
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
    }

    /* Footer */
    footer {
      margin-top: auto;
      border-top: 1px solid var(--line);
      background: rgba(5, 5, 7, 0.82);
      backdrop-filter: blur(16px);
      padding: 40px 0 26px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      gap: 32px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--line);
    }

    .footer-brand p {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.75;
      margin-top: 12px;
      max-width: 340px;
    }

    .footer-col h3 {
      font-size: 0.95rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 14px;
    }

    .footer-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .footer-links a {
      text-decoration: none;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 700;
      transition: color 0.2s ease;
    }

    .footer-links a:hover { color: var(--accent); }

    .footer-bottom {
      padding-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    @media (max-width: 900px) {
      .top-intro { grid-template-columns: 1fr; gap: 32px; margin-bottom: 48px; }
      .photo-stream { grid-template-columns: repeat(2, 1fr); gap: 14px; }
      .footer-grid { grid-template-columns: 1fr; gap: 24px; }

      nav {
        display: none;
        position: fixed;
        top: 66px;
        right: 0;
        left: 0;
        background: rgba(5, 5, 7, 0.98);
        backdrop-filter: blur(20px);
        flex-direction: column;
        padding: 22px 20px;
        gap: 16px;
        border-bottom: 1px solid var(--line);
        z-index: 290;
      }
      nav.open { display: flex; }
      .menu-btn { display: inline-block; }
    }

    @media (max-width: 600px) {
      .container { padding: 0 18px; }
      .main-flow { padding: 36px 0 64px; }
      .stats-inline { gap: 22px; }
      .photo-stream { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    }
  </style>
</head>
<body>

  <!-- إنترو افتتاحي للموقع -->
  <div id="siteIntro" onclick="dismissIntro()">
    <span class="clip-brand-font intro-brand">SHERIF KHALID</span>
    <span class="intro-sub">OFFICIAL HUB</span>
  </div>

  <!-- فيديو الخلفية الصامت بإضاءة أوضح -->
  <div class="ambient-video-bg" aria-hidden="true">
    <video autoplay muted loop playsinline preload="auto">
      <source src="assts/shx.mp4" type="video/mp4">
    </video>
  </div>
  <div class="ambient-overlay" aria-hidden="true"></div>

  <div id="site-header"></div>

  <main class="main-flow">
    <div class="container">
      <section class="top-intro">
        <div>
          <h1>
            <span class="clip-brand-font hero-title">SHERIF KHALID</span>
          </h1>

          <p class="intro-text">
            حضور جماهيري يتخطى 16 مليون متابع عبر المنصات، وأعمال غنائية وجولات حية. هنا المساحة الرسمية لكل جديد وللتواصل المباشر.
          </p>

          <div class="stats-inline">
            <div class="stat-item">
              <strong class="num counter" data-target="12" data-suffix="M+">0</strong>
              <span>متابع على TikTok</span>
            </div>
            <div class="stat-item">
              <strong class="num counter" data-target="3" data-suffix="M+">0</strong>
              <span>متابع على Instagram</span>
            </div>
            <div class="stat-item">
              <strong class="num counter" data-target="1" data-suffix="M+">0</strong>
              <span>متابع على YouTube</span>
            </div>
          </div>
        </div>

        <img class="lead-portrait" src="assts/sherif_khalid7.jpg" alt="شريف خالد">
      </section>

      <h2 class="flow-title">بابا ياض</h2>
      <div class="track-player">
        <iframe
          src="https://drive.google.com/file/d/1-lU7XJ8MST3x_Mo7UfRbabdMzoVzhFSf/preview"
          allow="autoplay; fullscreen"
          allowfullscreen>
        </iframe>
      </div>

      <h2 class="flow-title">الصور</h2>
      <div class="photo-stream">
        <img src="assts/sherif_khalid2.jpg" alt="شريف خالد" onclick="openLightbox(this.src)">
        <img src="assts/sherif_khahid.jpg" alt="شريف خالد" onclick="openLightbox(this.src)">
        <img src="assts/sherif_khalid4.jpg" alt="شريف خالد" onclick="openLightbox(this.src)">
        <img src="assts/zherif_khalid5.jpg" alt="شريف خالد" onclick="openLightbox(this.src)">
        <img src="assts/shreif+khalid6.jpg" alt="شريف خالد" onclick="openLightbox(this.src)">
      </div>
    </div>
  </main>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <div class="lightbox-panel" onclick="event.stopPropagation()">
      <button type="button" class="lightbox-close" onclick="closeLightbox()">إغلاق</button>
      <img id="lightboxImg" src="" alt="معاينة الصورة">
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="layout.js"></script>
  <script>
    const siteIntro = document.getElementById('siteIntro');
    function dismissIntro() {
      if (siteIntro) siteIntro.classList.add('done');
    }
    setTimeout(dismissIntro, 1300);

    function openLightbox(src) {
      const lb = document.getElementById('lightbox');
      const img = document.getElementById('lightboxImg');
      img.src = src;
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      const lb = document.getElementById('lightbox');
      lb.classList.remove('open');
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });

    document.querySelectorAll('.counter').forEach(el => {
      const target = +el.dataset.target;
      const suffix = el.dataset.suffix || '';
      let current = 0;
      const step = Math.max(1, Math.ceil(target / 24));
      const timer = setInterval(() => {
        current += step;
        if (current >= target) {
          el.textContent = target + suffix;
          clearInterval(timer);
        } else {
          el.textContent = current + suffix;
        }
      }, 45);
    });
  </script>
</body>
</html>
