<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SHERIF KHALID — Official Hub</title>
  <link rel="icon" href="assts/sherif_khalid7.jpg" type="image/jpeg" />
  <link rel="apple-touch-icon" href="assts/sherif_khalid7.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Cairo:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050709;
      --panel: rgba(12, 16, 20, 0.72);
      --panel-hover: rgba(18, 24, 30, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #10b981;
      --accent-soft: rgba(16, 185, 129, 0.14);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
    html { overflow-x: clip; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Cairo', sans-serif;
      overflow-x: clip;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* خلفية الفيديو المستمرة بـ opacity واطي وتسويد دارك */
    .bg-video-layer {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      pointer-events: none;
      background: #050709;
    }

    .bg-video-layer video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.13;
      filter: grayscale(35%) contrast(1.08);
    }

    .bg-dark-scrim {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(circle at 80% 15%, rgba(16, 185, 129, 0.09), transparent 42%),
        linear-gradient(180deg, rgba(5, 7, 9, 0.78) 0%, rgba(5, 7, 9, 0.88) 55%, rgba(5, 7, 9, 0.96) 100%);
    }

    .num { font-family: 'Plus Jakarta Sans', sans-serif; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 22px; width: 100%; }

    .clip-brand-font {
      font-family: 'Anton', 'Archivo Black', sans-serif;
      font-style: italic;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      line-height: 0.96;
      display: inline-block;
      transform: skewX(-7deg) scaleY(1.06);
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 300;
      background: rgba(5, 7, 9, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 15px 0;
    }

    .nav-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      gap: 20px;
    }

    .brand {
      text-decoration: none;
      color: #fff;
      font-size: clamp(1.15rem, 2.2vw, 1.45rem);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .brand-tag {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: var(--accent);
      border: 1px solid rgba(16, 185, 129, 0.35);
      background: var(--accent-soft);
      padding: 2px 8px;
      border-radius: 6px;
      transform: skewX(7deg);
    }

    nav {
      display: flex;
      gap: 26px;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.94rem;
      padding: 6px 2px;
      transition: color 0.2s ease;
    }

    nav a:hover,
    nav a.active {
      color: #fff;
    }

    nav a.active {
      color: var(--accent);
    }

    .menu-btn {
      display: none;
      background: var(--panel);
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      font-family: 'Cairo', sans-serif;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Hero */
    .hero {
      padding: 58px 0 38px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 44px;
      align-items: center;
    }

    .hero-kicker {
      display: inline-block;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
    }

    h1 .hero-title {
      display: block;
      font-size: clamp(3rem, 7vw, 5.7rem);
      background: linear-gradient(180deg, #ffffff 35%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      transform-origin: right center;
      margin-bottom: 18px;
    }

    .hero-desc {
      color: var(--muted);
      font-size: clamp(1rem, 1.35vw, 1.08rem);
      line-height: 1.85;
      max-width: 540px;
      margin-bottom: 28px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      max-width: 560px;
    }

    .stat-card {
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 14px;
      transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
    }

    .stat-card:hover {
      transform: translateY(-3px);
      background: var(--panel-hover);
      border-color: rgba(16, 185, 129, 0.4);
    }

    .stat-num {
      font-size: clamp(1.5rem, 2.4vw, 1.95rem);
      font-weight: 800;
      color: #fff;
      line-height: 1.1;
    }

    .stat-label {
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 700;
      margin-top: 6px;
    }

    .hero-photo {
      border-radius: 26px;
      padding: 10px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      box-shadow: 0 28px 65px -22px rgba(0, 0, 0, 0.9);
    }

    .hero-photo img {
      width: 100%;
      aspect-ratio: 4 / 5;
      max-height: 560px;
      object-fit: cover;
      object-position: center top;
      border-radius: 18px;
      display: block;
    }

    /* Section Headings */
    .sec-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .sec-head .tag {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      display: block;
      margin-bottom: 4px;
    }

    .sec-head h2 {
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      font-weight: 900;
      color: #fff;
    }

    /* Reel Video (9 / 16) */
    .reel-section {
      padding: 44px 0 36px;
    }

    .reel-center {
      display: flex;
      justify-content: center;
    }

    .reel-frame {
      width: 100%;
      max-width: 390px;
      aspect-ratio: 9 / 16;
      border-radius: 26px;
      padding: 8px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(16, 185, 129, 0.25);
      box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.92);
    }

    .reel-frame video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 19px;
      display: block;
      background: #050709;
    }

    /* Gallery */
    .gallery-section {
      padding: 44px 0 80px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .gallery-card {
      border-radius: 20px;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      aspect-ratio: 4 / 5;
      cursor: pointer;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .gallery-card:hover {
      transform: translateY(-4px);
      border-color: rgba(16, 185, 129, 0.45);
    }

    .gallery-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
      transition: transform 0.45s ease;
    }

    .gallery-card:hover img {
      transform: scale(1.04);
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(5, 7, 9, 0.92);
      backdrop-filter: blur(16px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox.open { display: flex; }

    .lightbox-panel {
      position: relative;
      max-width: 780px;
      width: 100%;
      border-radius: 22px;
      overflow: hidden;
      background: #090c10;
      border: 1px solid var(--border);
    }

    .lightbox-panel img {
      width: 100%;
      max-height: 82dvh;
      object-fit: contain;
      display: block;
      background: #050709;
    }

    .lightbox-close {
      position: absolute;
      top: 14px;
      left: 14px;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(5, 7, 9, 0.88);
      color: #fff;
      font-family: 'Cairo', sans-serif;
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
    }

    /* Footer */
    footer {
      margin-top: auto;
      border-top: 1px solid var(--border);
      background: rgba(5, 7, 9, 0.82);
      backdrop-filter: blur(14px);
      padding: 40px 0 26px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      gap: 32px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border);
    }

    .footer-brand p {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.75;
      margin-top: 12px;
      max-width: 340px;
    }

    .footer-col h3 {
      font-size: 0.95rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 14px;
    }

    .footer-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .footer-links a {
      text-decoration: none;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 700;
      transition: color 0.2s ease;
    }

    .footer-links a:hover {
      color: var(--accent);
    }

    .footer-bottom {
      padding-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    @media (max-width: 960px) {
      .hero-grid { grid-template-columns: 1fr; gap: 32px; }
      .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
      .footer-grid { grid-template-columns: 1fr; gap: 24px; }

      nav {
        display: none;
        position: fixed;
        top: 66px;
        right: 0;
        left: 0;
        background: rgba(6, 8, 11, 0.98);
        backdrop-filter: blur(20px);
        flex-direction: column;
        padding: 22px 20px;
        gap: 16px;
        border-bottom: 1px solid var(--border);
        z-index: 290;
      }
      nav.open { display: flex; }
      .menu-btn { display: inline-block; }
    }

    @media (max-width: 600px) {
      .container { padding: 0 16px; }
      .hero { padding: 34px 0 24px; }
      .stats-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .stat-card { padding: 12px 8px; border-radius: 14px; text-align: center; }
      .stat-num { font-size: 1.25rem; }
      .stat-label { font-size: 0.72rem; }

      .reel-frame { max-width: 340px; border-radius: 22px; }
      .reel-frame video { border-radius: 16px; }

      .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .gallery-card { border-radius: 16px; }
    }
  </style>
</head>
<body>

  <!-- خلفية الفيديو المستمرة للموقع -->
  <div class="bg-video-layer" aria-hidden="true">
    <video autoplay muted loop playsinline preload="auto">
      <source src="assts/shx.mp4" type="video/mp4">
    </video>
  </div>
  <div class="bg-dark-scrim" aria-hidden="true"></div>

  <div id="site-header"></div>

  <section class="hero">
    <div class="container hero-grid">
      <div>
        <span class="hero-kicker">OFFICIAL HUB</span>
        <h1>
          <span class="clip-brand-font hero-title">SHERIF KHALID</span>
        </h1>

        <p class="hero-desc">
          حضور جماهيري يتخطى 16 مليون متابع عبر المنصات، وأعمال غنائية وجولات حية. هنا المساحة الرسمية لكل جديد وللتواصل المباشر.
        </p>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-num num counter" data-target="12" data-suffix="M+">0</div>
            <div class="stat-label">متابع على TikTok</div>
          </div>
          <div class="stat-card">
            <div class="stat-num num counter" data-target="3" data-suffix="M+">0</div>
            <div class="stat-label">متابع على Instagram</div>
          </div>
          <div class="stat-card">
            <div class="stat-num num counter" data-target="1" data-suffix="M+">0</div>
            <div class="stat-label">متابع على YouTube</div>
          </div>
        </div>
      </div>

      <div class="hero-photo">
        <img src="assts/sherif_khalid7.jpg" alt="شريف خالد">
      </div>
    </div>
  </section>

  <section id="reel-video" class="reel-section">
    <div class="container">
      <div class="sec-head">
        <div>
          <span class="tag">REEL SHOWCASE</span>
          <h2>شريف خالد</h2>
        </div>
      </div>

      <div class="reel-center">
        <div class="reel-frame">
          <video autoplay muted loop playsinline controls preload="auto" poster="assts/sherif_khalid7.jpg">
            <source src="assts/shx.mp4" type="video/mp4">
          </video>
        </div>
      </div>
    </div>
  </section>

  <section id="gallery" class="gallery-section">
    <div class="container">
      <div class="sec-head">
        <div>
          <span class="tag">GALLERY</span>
          <h2>الصور</h2>
        </div>
      </div>

      <div class="gallery-grid">
        <div class="gallery-card" onclick="openLightbox('assts/sherif_khalid2.jpg')">
          <img src="assts/sherif_khalid2.jpg" alt="شريف خالد">
        </div>
        <div class="gallery-card" onclick="openLightbox('assts/sherif_khahid.jpg')">
          <img src="assts/sherif_khahid.jpg" alt="شريف خالد">
        </div>
        <div class="gallery-card" onclick="openLightbox('assts/sherif_khalid4.jpg')">
          <img src="assts/sherif_khalid4.jpg" alt="شريف خالد">
        </div>
        <div class="gallery-card" onclick="openLightbox('assts/zherif_khalid5.jpg')">
          <img src="assts/zherif_khalid5.jpg" alt="شريف خالد">
        </div>
        <div class="gallery-card" onclick="openLightbox('assts/shreif+khalid6.jpg')">
          <img src="assts/shreif+khalid6.jpg" alt="شريف خالد">
        </div>
      </div>
    </div>
  </section>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <div class="lightbox-panel" onclick="event.stopPropagation()">
      <button type="button" class="lightbox-close" onclick="closeLightbox()">إغلاق</button>
      <img id="lightboxImg" src="" alt="معاينة الصورة">
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="layout.js"></script>
  <script>
    function openLightbox(src) {
      const lb = document.getElementById('lightbox');
      const img = document.getElementById('lightboxImg');
      img.src = src;
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      const lb = document.getElementById('lightbox');
      lb.classList.remove('open');
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });

    document.querySelectorAll('.counter').forEach(el => {
      const target = +el.dataset.target;
      const suffix = el.dataset.suffix || '';
      let current = 0;
      const step = Math.max(1, Math.ceil(target / 24));
      const timer = setInterval(() => {
        current += step;
        if (current >= target) {
          el.textContent = target + suffix;
          clearInterval(timer);
        } else {
          el.textContent = current + suffix;
        }
      }, 45);
    });
  </script>
</body>
</html>
